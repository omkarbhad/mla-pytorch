[project]
name = "mla-pytorch"
version = "0.1.0"
description = "Multi-head Latent Attention (DeepSeek-V2) in PyTorch: a low-rank latent KV cache with decoupled RoPE, with a standard multi-head baseline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mla_pytorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
